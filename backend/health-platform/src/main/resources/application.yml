spring:
  config:
    import: optional:file:../../.env[.properties]

  application:
    name: health-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:health_platform}
    username: ${DB_USERNAME:health_admin}
    password: ${DB_PASSWORD:health_admin_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  web:
    error:
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-exception: false

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

storage:
  local:
    root-dir: ${FILE_STORAGE_ROOT:./storage}

server:
  port: 8080